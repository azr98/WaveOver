# Use AWS VPC DNS Resolver (Make sure 10.0.1.2 is correct for your VPC)
resolver 10.0.1.2 valid=30s;
resolver_timeout 5s;

upstream backend {
    zone backend_zone 64k;  # Allocate shared memory for dynamic resolution
    server devbackend.waveover.info:443 resolve;  # Use dynamic DNS resolution
    # Removed keepalive to avoid reusing stale connections
}

server {
    listen 80;
    server_name dev.waveover.info;

    # Enable debug logging
    error_log /var/log/nginx/error.log debug;
    access_log /var/log/nginx/access.log combined;

    # Frontend routing for SPA
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # Proxy API requests to backend ALB using HTTPS
    location /api/ {
        rewrite ^/api(/.*)$ $1 break;
        
        # Log the rewritten URL for debugging
        add_header X-Original-URI $request_uri always;
        add_header X-Rewritten-URI $1 always;
        
        proxy_pass https://backend;
        
        # Use HTTP/1.1 and force connection closure to prevent reuse of stale connections
        proxy_http_version 1.1;
        proxy_set_header Connection "close";
        
        proxy_ssl_name devbackend.waveover.info;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/cert.pem;
        
        proxy_set_header Host devbackend.waveover.info;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-Debug-Message "Proxying to backend" always;
        error_log /var/log/nginx/api_debug.log debug;

        # Handle OPTIONS preflight requests
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://dev.waveover.info" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization" always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Length 0;
            add_header Content-Type "text/plain; charset=UTF-8";
            return 204;
        }

        # CORS for non-OPTIONS requests
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "https://dev.waveover.info" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE" always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization" always;

        # Increased timeout settings
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;

        # Try another upstream if errors occur (e.g., stale connection)
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    }

    # Gzip compression settings...
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml;
    gzip_disable "MSIE [1-6]\\.";
}







