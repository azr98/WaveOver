name: Build and Deploy to EC2

on:
  push:
    paths:
      - 'client/**'
      - '.github/workflows/deploy-front.yml'
    branches:
      - asg-launch-workflow  # Trigger the workflow when commits are pushed to master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: WaveOver-Development
    env:
      AWS_DEFAULT_REGION: eu-west-1
      ASG_NAME: WaveOver-Development-Frontend
    permissions:
      id-token: write
      contents: read

    steps:
      # Step 1: Check out the repository
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug OIDC Token
        run: |
          echo "Fetching OIDC Token..."
          TOKEN=$(curl -sSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" $ACTIONS_ID_TOKEN_REQUEST_URL | jq -r '.value')
          echo "OIDC Token (encoded): $TOKEN"
          echo "OIDC Token (decoded):"
          echo "$TOKEN" | base64 -d | jq '.'
      
      # Step 4: Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::058264329805:role/GitHubActionsRole-Dev
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      # New Step: Update SSM Parameter with commit hash
      - name: Update SSM Parameter with commit hash
        run: |
          COMMIT_HASH=$(git rev-parse HEAD)
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
          aws ssm put-parameter \
            --name "frontend-waveover-development-ecr-commit-hash-tag" \
            --value "$COMMIT_HASH" \
            --type "String" \
            --overwrite

      # Step 5: Log in to Amazon ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: waveover-development
        run: |
          IMAGE_TAG=$(echo $GITHUB_REF_NAME | tr / -)-$(date +%Y%m%d%H%M%S)
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
      
          echo "Building Docker Image..."
          docker build -f client/WaveOverFrontDocker -t $REGISTRY/$REPOSITORY:$IMAGE_TAG client/
      
          echo "Tagging Image with commit hash and latest..."
          docker tag $REGISTRY/$REPOSITORY:$IMAGE_TAG $REGISTRY/$REPOSITORY:$COMMIT_HASH
          docker tag $REGISTRY/$REPOSITORY:$IMAGE_TAG $REGISTRY/$REPOSITORY:latest
      
          echo "Pushing all image tags to ECR..."
          docker push --all-tags $REGISTRY/$REPOSITORY

      # Step 8: Get ASG Instance IPs
      - name: Get ASG Instance IPs
        run: |
          # Get instance IDs from ASG using the tag
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:aws:autoscaling:groupName,Values=${{ env.ASG_NAME }}" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)
          
          # Get private IPs for all instances
          for instance_id in $INSTANCE_IDS; do
            PRIVATE_IP=$(aws ec2 describe-instances \
              --instance-ids $instance_id \
              --query "Reservations[].Instances[].PrivateIpAddress" \
              --output text)
            echo "$PRIVATE_IP" >> instance_ips.txt
          done
          
          echo "Found the following instances:"
          cat instance_ips.txt

      # Step 9: Deploy to All ASG Instances
      - name: Deploy to All ASG Instances
        env:
          REPOSITORY: waveover-development
          SSH_PRIVATE_KEY: ${{ secrets.WAVEOVER_DEV_PEM_KEY }}
        run: |
          # Save SSH key
          echo "$SSH_PRIVATE_KEY" > ssh_key.pem
          chmod 600 ssh_key.pem
          
          while IFS= read -r ip; do
            echo "Deploying to instance $ip..."
            
            # Clean up Docker on the instance
            ssh -o StrictHostKeyChecking=no -i ssh_key.pem ec2-user@$ip "
              REPOSITORY=\"waveover-development\"
              AWS_REGION=\"eu-west-1\"
              REGISTRY=\"058264329805.dkr.ecr.\$AWS_REGION.amazonaws.com\"

              echo 'Stopping and removing the old container (if exists)...'
              docker stop waveover-container || true
              docker rm waveover-container || true

              echo 'Fetching latest image ID from ECR...'
              LATEST_IMAGE_ID=\$(docker images --format \"{{.ID}}\" \$REGISTRY/\$REPOSITORY:latest)

              echo 'Finding all old images except the latest...'
              docker images \$REGISTRY/\$REPOSITORY --format \"{{.ID}} {{.Repository}}:{{.Tag}}\" | grep -v \$LATEST_IMAGE_ID | awk '{print \$1}' | xargs -r docker rmi -f

              echo 'Pruning unused resources...'
              docker system prune -f

              echo 'Logging in to Amazon ECR...'
              aws ecr get-login-password --region \$AWS_REGION | docker login --username AWS --password-stdin \$REGISTRY

              echo 'Pulling latest image...'
              docker pull \$REGISTRY/\$REPOSITORY:latest

              echo 'Running container...'
              docker run -d --name waveover-container -p 80:80 \$REGISTRY/\$REPOSITORY:latest
            "
            
            if [ $? -eq 0 ]; then
              echo "Successfully deployed to $ip"
            else
              echo "Failed to deploy to $ip"
              exit 1
            fi
          done < instance_ips.txt
          
          # Clean up
          rm -f ssh_key.pem instance_ips.txt

      # Step 10: Output Docker Image Details
      - name: Output Docker Image Details
        env:
              REPOSITORY: waveover-development
        run: |
          echo "Docker image built and used:"
          echo "Repository: 058264329805.dkr.ecr.eu-west-1.amazonaws.com/$REPOSITORY"
          echo "Tag: $COMMIT_HASH"
          echo "Latest Tag: latest"







